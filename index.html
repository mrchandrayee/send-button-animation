<body>
<main class="page">
  <h1>Send Button<br><span>Animation</span></h1>
  <section class="demo" aria-label="Send and skip button animation">
    <div class="button-row">
      <button class="action send" id="sendBtn" type="button" aria-label="Send">
        <span class="button-content">
          <svg class="plane send-plane" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 21 3l-7.7 18-2.1-7.2L3 11.5Zm8.2 2.3L21 3"/></svg>
          <span class="button-label">SEND</span>
        </span>
        <span class="success-label">SENT</span>
      </button>
      <button class="action skip" id="skipBtn" type="button" aria-label="Skip">
        <span class="button-content">
          <svg class="plane skip-plane" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 21 3l-7.7 18-2.1-7.2L3 11.5Zm8.2 2.3L21 3"/></svg>
          <span class="button-label">SKIP</span>
        </span>
        <span class="success-label">OUT</span>
      </button>
    </div>
    <p class="hint" id="hint" aria-live="polite">Choose an action to see the animation.</p>
    <button class="reset" id="resetBtn" type="button">↻ Reset animation</button>
  </section>
  <footer><span class="dot"></span> CODE_AND_CHILL</footer>
</main>
<script src="app.js"></script>
</body>
